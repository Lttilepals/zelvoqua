<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Programs | Zelvoqua Global Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#0f172a;--muted:#64748b;--line:#dbe4f2;--primary:#4f46e5;--primary2:#7c3aed;--shadow:0 20px 60px rgba(15,23,42,.08)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at top left,rgba(79,70,229,.1),transparent 35%),radial-gradient(circle at top right,rgba(124,58,237,.1),transparent 30%),linear-gradient(180deg,#f8faff 0,#f6f8fc 100%);color:var(--text)}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 40px));margin:0 auto}.nav{position:sticky;top:0;z-index:100;background:rgba(246,248,252,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(219,228,242,.7)}.nav-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:1.5rem;font-weight:800;letter-spacing:-.04em}.brand span{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.nav-links{display:flex;gap:14px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-size:.94rem;font-weight:700;border:1px solid transparent}.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 10px 30px rgba(79,70,229,.14)}.btn-outline{color:var(--text);background:rgba(255,255,255,.72);border-color:var(--line)}.hero{padding:72px 0 36px}.eyebrow{display:inline-flex;padding:8px 14px;border-radius:999px;background:rgba(79,70,229,.08);color:var(--primary);border:1px solid rgba(79,70,229,.14);font-size:.82rem;font-weight:700;margin-bottom:18px}.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);line-height:1;letter-spacing:-.06em}.hero p{max-width:720px;margin-top:18px;color:var(--muted);line-height:1.8;font-size:1rem}.toolbar{margin-top:28px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.search{width:100%;border-radius:18px;border:1px solid var(--line);background:#fff;padding:16px 18px;font-size:.98rem;box-shadow:var(--shadow)}.section{padding:22px 0 70px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:24px;border-radius:24px;background:rgba(255,255,255,.9);border:1px solid rgba(219,228,242,.95);box-shadow:var(--shadow);transition:.22s ease}.card:hover{transform:translateY(-4px);box-shadow:0 30px 60px rgba(15,23,42,.12)}.cat{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);margin-bottom:12px}.title{font-size:1.08rem;line-height:1.45;margin-bottom:14px}.meta{display:grid;gap:10px;margin-bottom:20px;color:var(--muted);font-size:.9rem}.empty{grid-column:1/-1;text-align:center;padding:36px;border-radius:24px;background:rgba(255,255,255,.8);border:1px solid rgba(219,228,242,.95);color:var(--muted)}@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:700px){.toolbar,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="index.html">Zelvo<span>qua</span></a><div class="nav-links"><a class="btn btn-outline" href="index.html">Back Home</a><a class="btn btn-outline" href="admin.html">Admin Login</a><a class="btn btn-primary" href="index.html">Student Login</a></div></div></header>
<section class="hero"><div class="container"><div class="eyebrow">Internship Programs</div><h1>Internship Programs</h1><p>Browse structured internship programs across business, consulting, analytics, and digital functions. Search by field and choose the track that fits your goals.</p><div class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Search by field, for example Finance, HR, Supply Chain or Marketing"><a class="btn btn-primary" href="index.html">Go to enrollment</a></div></div></section>
<section class="section"><div class="container"><div class="grid" id="internshipGrid"></div></div></section>
<script>
const internships=[{category:'Finance',title:'Financial Analytics Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Finance',title:'Business Finance Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Human Resources',title:'HR Operations Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Human Resources',title:'Talent Acquisition Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Supply Chain',title:'Supply Chain Management Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Supply Chain',title:'Procurement & Logistics Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Marketing',title:'Digital Marketing Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Marketing',title:'Market Research Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Business Management',title:'Business Consulting Internship',duration:'2 Months',projects:'2',certificate:'Yes'},{category:'Business Management',title:'Operations Strategy Internship',duration:'2 Months',projects:'2',certificate:'Yes'}];
function renderCards(items){const grid=document.getElementById('internshipGrid');if(!items.length){grid.innerHTML='<div class="empty">No internship programs match this search.</div>';return}grid.innerHTML=items.map(item=>`<article class="card"><div class="cat">${item.category}</div><div class="title">${item.title}</div><div class="meta"><div>Duration: ${item.duration}</div><div>Projects: ${item.projects}</div><div>Certificate: ${item.certificate}</div></div><a class="btn btn-primary" href="index.html">Enroll</a></article>`).join('')}
document.getElementById('searchInput').addEventListener('input',event=>{const query=event.target.value.trim().toLowerCase();renderCards(internships.filter(item=>`${item.category} ${item.title}`.toLowerCase().includes(query)))});
renderCards(internships);
</script>
</body>
</html>
